[project]
name = "img-clicker"
version = "1.0.1"
description = "A Linux X11 image detection and clicking tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mss>=10.2.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pyautogui>=0.9.54",
    "typer>=0.27.3",
]

[project.scripts]
imgc = "imgc:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["imgc", "main", "detector", "controller"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
